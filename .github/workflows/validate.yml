name: Rust validation and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readme-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/render_readme_workflow.py --check
      - run: python -m unittest discover -s tests -p test_readme_workflow_assets.py
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: target/release/atropos
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: target/release/atropos.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release --bin atropos
      - run: ${{ matrix.exe }} validate
      - run: ${{ matrix.exe }} package --output dist/axiom-atropos-2.0.0-rust.1-${{ matrix.target }}.${{ matrix.extension }}
      - if: runner.os == 'Linux'
        run: |
          cargo package --locked
          cp target/package/axiom-atropos-2.0.0-rust.1.crate dist/
          cd dist
          sha256sum *.crate > axiom-atropos-2.0.0-rust.1.crate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: atropos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
