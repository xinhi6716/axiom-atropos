<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="594" viewBox="0 0 1200 594" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Axiom Atropos: Choose a skill. Follow the evidence.</title>
<desc id="desc">A suggested way to use the skill pack: choose a relevant skill, set the scope and deliverable, apply the workflow while keeping evidence, then review the result. This is not a separate execution engine.</desc>
<rect width="1200" height="594" fill="#101a22"/>
<path d="M24 1H1176M24 593H1176" stroke="#586052"/>
<text x="36" y="39" font-size="19" fill="#d7bd82" font-family="'Courier New', monospace" text-anchor="start">AXIOM / ATROPOS</text>
<text x="36" y="99" font-size="43" fill="#f4efe3" font-family="Georgia, 'Noto Serif CJK TC', 'Times New Roman', serif" text-anchor="start">Choose a skill. Follow the evidence.</text>
<path d="M36 124H1164" stroke="#586052"/>
<g data-step="1">
<rect x="36" y="150" width="552" height="160" rx="6" fill="#172530" stroke="#586052"/>
<circle cx="74" cy="189" r="20" fill="#101a22" stroke="#b89a58"/>
<text x="74" y="196" font-size="19" fill="#d7bd82" font-family="'Courier New', monospace" text-anchor="middle">01</text>
<text x="108" y="199" font-size="31" fill="#f4efe3" font-family="Georgia, 'Noto Serif CJK TC', 'Times New Roman', serif" text-anchor="start">Choose</text>
<text x="60" y="246" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Find a relevant skill</text>
<text x="60" y="280" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Match it to the task</text>
</g>
<path d="M592 230h16m-5-5 5 5-5 5" fill="none" stroke="#b89a58" stroke-width="1.5"/>
<g data-step="2">
<rect x="612" y="150" width="552" height="160" rx="6" fill="#172530" stroke="#586052"/>
<circle cx="650" cy="189" r="20" fill="#101a22" stroke="#b89a58"/>
<text x="650" y="196" font-size="19" fill="#d7bd82" font-family="'Courier New', monospace" text-anchor="middle">02</text>
<text x="684" y="199" font-size="31" fill="#f4efe3" font-family="Georgia, 'Noto Serif CJK TC', 'Times New Roman', serif" text-anchor="start">Scope</text>
<text x="636" y="246" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Set the boundaries</text>
<text x="636" y="280" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Name the deliverable</text>
</g>
<g data-step="3">
<rect x="36" y="334" width="552" height="160" rx="6" fill="#172530" stroke="#586052"/>
<circle cx="74" cy="373" r="20" fill="#101a22" stroke="#b89a58"/>
<text x="74" y="380" font-size="19" fill="#d7bd82" font-family="'Courier New', monospace" text-anchor="middle">03</text>
<text x="108" y="383" font-size="31" fill="#f4efe3" font-family="Georgia, 'Noto Serif CJK TC', 'Times New Roman', serif" text-anchor="start">Apply</text>
<text x="60" y="430" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Follow the workflow</text>
<text x="60" y="464" font-size="24" fill="#c9c4b6" font-family="Arial, 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">Keep useful evidence</text>
</g>
